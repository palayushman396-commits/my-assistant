<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VedicAI — Personal Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(120, 40, 200, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(40, 120, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(255, 100, 50, 0.05) 0%, transparent 60%);
            z-index: 0;
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(3%, 3%) rotate(2deg); }
        }

        .header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user { flex-direction: row-reverse; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .avatar.bot {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.3);
        }

        .avatar.user-av {
            background: linear-gradient(135deg, #f472b6, #fb923c);
            box-shadow: 0 0 12px rgba(244, 114, 182, 0.3);
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
        }

        .bot-message {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(10px);
        }

        .user-message {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 14px 16px;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            animation: bounce 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .welcome {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }

        .welcome h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .input-area {
            position: relative;
            z-index: 10;
            padding: 16px 20px 20px;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(124, 58, 237, 0.6);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255,255,255,0.9);
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px;
            padding: 8px 0;
        }

        .input-wrapper input::placeholder { color: rgba(255,255,255,0.25); }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.15s, box-shadow 0.15s;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .send-btn:active { transform: scale(0.96); }

        .hint {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🕉️</div>
            <span class="logo-text">VedicAI</span>
        </div>
        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="welcome">
            <h2>VedicAI</h2>
            <p>Your personal AI assistant. Ask me anything.</p>
        </div>
        <div class="message-row">
            <div class="avatar bot">🕉️</div>
            <div class="message bot-message">Namaste! 🙏 I am VedicAI, your personal assistant. How can I help you today?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Ask VedicAI anything..." onkeypress="handleKey(event)" />
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
        <div class="hint">Press Enter to send</div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `
                <div class="message-row user">
                    <div class="avatar user-av">👤</div>
                    <div class="message user-message">${message}</div>
                </div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            chatBox.innerHTML += `
                <div class="message-row" id="typing-row">
                    <div class="avatar bot">🕉️</div>
                    <div class="message bot-message">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            document.getElementById("typing-row").remove();

            chatBox.innerHTML += `
                <div class="message-row">
                    <div class="avatar bot">🕉️</div>
                    <div class="message bot-message">${data.reply}</div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter") sendMessage();
        }
       
    </script>
</body>
</html>
